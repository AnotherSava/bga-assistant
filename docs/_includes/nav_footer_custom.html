<!-- Suppresses just-the-docs' "This site uses Just the Docs" footer, in the sidebar and in the
     narrow-screen copy under the content.

     Must stay NON-EMPTY: the theme ships its own copy as a 0-byte file and falls through to the
     attribution whenever this include renders empty, so a blank override changes nothing. A comment
     is non-empty as a string and renders nothing visible.

     Must contain no Liquid delimiters either, not even inside this comment: the include is parsed
     as Liquid before it is treated as HTML, so quoting the theme's guard here breaks the build. -->
