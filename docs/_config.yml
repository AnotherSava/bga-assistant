title: BGA Assistant
description: A Chrome extension for Board Game Arena that keeps track of your games so you don't have to
# Pinned. Without a ref, jekyll-remote-theme rebuilds from the theme's default branch, so the version
# serving this site is not knowable from the repo and can move under it with nothing changing here.
# That matters because the attribution footer suppressed by _includes/nav_footer_custom.html is a
# theme fallback: which version is serving decides whether the override still reaches it.
remote_theme: just-the-docs/just-the-docs@v0.12.0
baseurl: /bga-assistant
plugins:
  - jekyll-remote-theme
color_scheme: light
search_enabled: true
heading_anchors: true

exclude:
  - plans/
  # Inputs to the frame step; Jekyll would otherwise publish each one beside its own frame.
  - screenshots/raw/
  # The capture tooling and its manifest are developer files, and Jekyll serves everything under
  # docs/ that is not listed here. Keep the trailing slash: entries are matched by prefix, so a bare
  # `screenshots/capture` would also drop any published frame whose name began "capture".
  - screenshots/capture/
  - screenshots/screenshots.json
